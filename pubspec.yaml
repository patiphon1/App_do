name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.2.10
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10
  firebase_database: ^11.3.10
  flutter_local_notifications: ^19.4.2
  flutter_floating_bottom_bar: ^1.3.0
  curved_navigation_bar: ^1.0.6
  image_picker: ^1.2.0
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  image_path: assets/icons/app_icon_1024.png
  android: true
  ios: true
  adaptive_icon_background: "#E3F2FD"
  adaptive_icon_foreground: assets/icons/android_adaptive_foreground_432.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
